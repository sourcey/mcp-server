name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release identity
        run: |
          node -e '
            const manifest = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${manifest.version}`) throw new Error(`${tag} does not match ${manifest.version}`);
          '
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Pack once
        run: |
          mkdir -p release
          npm pack --json --pack-destination release > release/pack.json
          node -e '
            const fs = require("fs");
            const record = JSON.parse(fs.readFileSync("release/pack.json", "utf8"))[0];
            fs.renameSync(`release/${record.filename}`, "release/sourcey-mcp-server.tgz");
          '
          sha256sum release/sourcey-mcp-server.tgz > release/sourcey-mcp-server.tgz.sha256
      - run: node scripts/verify-packed-package.mjs --tar release/sourcey-mcp-server.tgz
      - name: Publish exact npm bytes if absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="@sourcey/mcp-server"
          version="${GITHUB_REF_NAME#v}"
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version already exists"
          else
            npm publish release/sourcey-mcp-server.tgz --access public --provenance
          fi
      - name: Verify npm registry bytes
        run: |
          mkdir -p registry
          for attempt in 1 2 3 4 5 6; do
            if npm pack "@sourcey/mcp-server@${GITHUB_REF_NAME#v}" --pack-destination registry >/dev/null 2>&1; then break; fi
            sleep $((attempt * 5))
          done
          registry_tar="$(find registry -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$registry_tar"
          test "$(sha256sum release/sourcey-mcp-server.tgz | cut -d' ' -f1)" = "$(sha256sum "$registry_tar" | cut -d' ' -f1)"
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sourcey/mcp-server:${{ github.ref_name }}
            ghcr.io/sourcey/mcp-server:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish exact GitHub release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/sourcey-mcp-server.tgz release/sourcey-mcp-server.tgz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/sourcey-mcp-server.tgz release/sourcey-mcp-server.tgz.sha256 --generate-notes --verify-tag
          fi
